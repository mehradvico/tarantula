# Production stack: ClickHouse (events) + the ingest API. Nothing here is published to the internet directly:
# both ports are bound to 127.0.0.1 and the reverse proxy (see Caddyfile.example / nginx.example.conf) exposes ONLY POST /v1/collect.
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: tarantula
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env.prod}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse-low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      - ./users-low-memory.xml:/etc/clickhouse-server/users.d/low-memory.xml:ro
    # The app server is small and shared with Pastil (about 1.5 GB free), so ClickHouse is capped hard.
    mem_limit: ${CLICKHOUSE_MEM_LIMIT:-1g}
    # This server also runs Pastil. If memory ever runs out, the kernel must sacrifice Tarantula first, never Pastil.
    oom_score_adj: 1000
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  api:
    image: tarantula-api:latest
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    oom_score_adj: 900
    mem_limit: 256m
    depends_on:
      clickhouse: { condition: service_healthy }
    ports:
      - "127.0.0.1:${TARANTULA_PORT:-5080}:8080"
    environment:
      TZ: Asia/Tehran
      Tarantula__ClickHouse__ConnectionString: Host=clickhouse;Port=8123;Username=default;Password=${CLICKHOUSE_PASSWORD}
      Tarantula__ClickHouse__RetentionDays: ${RETENTION_DAYS:-180}
      Tarantula__Projects__Items__0__Id: pastil
      Tarantula__Projects__Items__0__Name: Pastil
      Tarantula__Projects__Items__0__WriteKey: ${PASTIL_WRITE_KEY:?set PASTIL_WRITE_KEY}
      Tarantula__Projects__Items__0__ReadKey: ${PASTIL_READ_KEY:?set PASTIL_READ_KEY}
      Tarantula__Projects__Items__0__AllowedOrigins__0: ${PASTIL_ORIGIN_1:-https://app.pastil.pet}
      Tarantula__Projects__Items__0__AllowedOrigins__1: ${PASTIL_ORIGIN_2:-https://pastil.pet}
      # Optional: the read-only Pastil business database. Empty = Users/Vendors pages say "not connected".
      Pastil__ConnectionString: ${PASTIL_READONLY_CONNECTION:-}

volumes:
  clickhouse-data:

# Local development stack. Production uses its own secrets and volumes.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: tarantula-clickhouse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"   # HTTP interface used by the ingest API
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: tarantula-dev   # development only
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  clickhouse-data:
